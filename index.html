<!DOCTYPE html>

<html lang="vi">

 <head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Heart Animation - Mia Lê</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <style>

  html, body {

  height: 100%;

  padding: 0;

  margin: 0;

  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);

  background-size: 400% 400%;

  animation: gradientShift 8s ease infinite;

}

@keyframes gradientShift {

  0% { background-position: 0% 50%; }

  50% { background-position: 100% 50%; }

  100% { background-position: 0% 50%; }

}

canvas {

  position: absolute;

  width: 100%;

  height: 100%;

}

.text-container {

  position: absolute;

  top: 50%;

  left: 50%;

  transform: translate(-50%, -50%);

  z-index: 100;

  text-align: center;

}

.name-text {

  font-size: 72px;

  font-weight: bold;

  color: white;

  text-shadow:

    0 0 10px rgba(255, 255, 255, 0.8),

    0 0 20px rgba(255, 255, 255, 0.6),

    0 0 30px rgba(255, 255, 255, 0.4),

    0 0 40px rgba(255, 105, 180, 0.8),

    0 0 70px rgba(255, 105, 180, 0.6),

    0 0 100px rgba(255, 105, 180, 0.4);

  animation: blink1 1s ease-in-out infinite,

             blink2 1.5s ease-in-out infinite,

             blink3 0.8s ease-in-out infinite,

             pulse 2s ease-in-out infinite;

  font-family: 'Great Vibes', 'Dancing Script', cursive;

  letter-spacing: 3px;

}

@keyframes blink1 {

  0%, 100% { opacity: 1; }

  50% { opacity: 0.7; }

}

@keyframes blink2 {

  0%, 100% {

    text-shadow:

      0 0 10px rgba(255, 255, 255, 0.8),

      0 0 20px rgba(255, 255, 255, 0.6),

      0 0 30px rgba(255, 255, 255, 0.4),

      0 0 40px rgba(255, 105, 180, 0.8),

      0 0 70px rgba(255, 105, 180, 0.6),

      0 0 100px rgba(255, 105, 180, 0.4);

  }

  50% {

    text-shadow:

      0 0 20px rgba(255, 255, 255, 1),

      0 0 30px rgba(255, 255, 255, 0.8),

      0 0 40px rgba(255, 255, 255, 0.6),

      0 0 50px rgba(255, 105, 180, 1),

      0 0 80px rgba(255, 105, 180, 0.8),

      0 0 120px rgba(255, 105, 180, 0.6);

  }

}

@keyframes blink3 {

  0%, 100% { transform: scale(1); }

  25% { transform: scale(1.05); }

  75% { transform: scale(0.98); }

}

@keyframes pulse {

  0%, 100% { filter: brightness(1); }

  50% { filter: brightness(1.3); }

}

.sparkle-container {

  position: absolute;

  top: 50%;

  left: 50%;

  transform: translate(-50%, -50%);

  width: 600px;

  height: 400px;

  z-index: 50;

  pointer-events: none;

}

.sparkle {

  position: absolute;

  width: 8px;

  height: 8px;

  background: white;

  border-radius: 50%;

  box-shadow: 0 0 10px rgba(255, 255, 255, 0.8),

              0 0 20px rgba(255, 105, 180, 0.6);

  animation: sparkleBlink 1.5s ease-in-out infinite;

}

.sparkle:nth-child(1) {

  top: 10%;

  left: 20%;

  animation-delay: 0s;

}

.sparkle:nth-child(2) {

  top: 15%;

  right: 25%;

  animation-delay: 0.3s;

}

.sparkle:nth-child(3) {

  bottom: 20%;

  left: 15%;

  animation-delay: 0.6s;

}

.sparkle:nth-child(4) {

  bottom: 15%;

  right: 20%;

  animation-delay: 0.9s;

}

.sparkle:nth-child(5) {

  top: 5%;

  left: 50%;

  animation-delay: 0.2s;

}

.sparkle:nth-child(6) {

  bottom: 5%;

  left: 50%;

  animation-delay: 0.5s;

}

.sparkle:nth-child(7) {

  top: 50%;

  left: 5%;

  animation-delay: 0.8s;

}

.sparkle:nth-child(8) {

  top: 50%;

  right: 5%;

  animation-delay: 1.1s;

}

.sparkle:nth-child(9) {

  top: 25%;

  left: 40%;

  animation-delay: 0.4s;

}

.sparkle:nth-child(10) {

  bottom: 25%;

  right: 40%;

  animation-delay: 0.7s;

}

.star {

  position: absolute;

  width: 20px;

  height: 20px;

  color: white;

  font-size: 24px;

  animation: starBlink 2s ease-in-out infinite;

  text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);

}

.star:nth-child(11) {

  top: 8%;

  left: 30%;

  animation-delay: 0s;

}

.star:nth-child(12) {

  top: 12%;

  right: 35%;

  animation-delay: 0.5s;

}

.star:nth-child(13) {

  bottom: 18%;

  left: 25%;

  animation-delay: 1s;

}

.star:nth-child(14) {

  bottom: 12%;

  right: 30%;

  animation-delay: 1.5s;

}

.star:nth-child(15) {

  top: 30%;

  left: 10%;

  animation-delay: 0.25s;

}

.star:nth-child(16) {

  top: 30%;

  right: 10%;

  animation-delay: 0.75s;

}

.heart-small {

  position: absolute;

  width: 16px;

  height: 16px;

  color: #ff69b4;

  font-size: 20px;

  animation: heartBlink 1.8s ease-in-out infinite;

  text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);

}

.heart-small:nth-child(17) {

  top: 20%;

  left: 45%;

  animation-delay: 0s;

}

.heart-small:nth-child(18) {

  bottom: 22%;

  left: 45%;

  animation-delay: 0.6s;

}

.heart-small:nth-child(19) {

  top: 50%;

  left: 12%;

  animation-delay: 0.3s;

}

.heart-small:nth-child(20) {

  top: 50%;

  right: 12%;

  animation-delay: 0.9s;

}

.heart-small:nth-child(21) {

  top: 35%;

  left: 35%;

  animation-delay: 0.45s;

}

.heart-small:nth-child(22) {

  bottom: 35%;

  right: 35%;

  animation-delay: 1.2s;

}

@keyframes sparkleBlink {

  0%, 100% {

    opacity: 0;

    transform: scale(0);

  }

  50% {

    opacity: 1;

    transform: scale(1.5);

    box-shadow: 0 0 15px rgba(255, 255, 255, 1),

                0 0 30px rgba(255, 105, 180, 0.8);

  }

}

@keyframes starBlink {

  0%, 100% {

    opacity: 0.3;

    transform: scale(0.8) rotate(0deg);

  }

  50% {

    opacity: 1;

    transform: scale(1.3) rotate(180deg);

    text-shadow: 0 0 20px rgba(255, 255, 255, 1),

                 0 0 30px rgba(255, 105, 180, 0.8);

  }

}

@keyframes heartBlink {

  0%, 100% {

    opacity: 0.4;

    transform: scale(0.9);

  }

  50% {

    opacity: 1;

    transform: scale(1.4);

    text-shadow: 0 0 15px rgba(255, 105, 180, 1),

                 0 0 25px rgba(255, 105, 180, 0.9);

  }

}

  </style>

 <body>

  <canvas id="pinkboard"></canvas>

  <div class="sparkle-container">

    <div class="sparkle"></div>

    <div class="sparkle"></div>

    <div class="sparkle"></div>

    <div class="sparkle"></div>

    <div class="sparkle"></div>

    <div class="sparkle"></div>

    <div class="sparkle"></div>

    <div class="sparkle"></div>

    <div class="sparkle"></div>

    <div class="sparkle"></div>

    <div class="star">✨</div>

    <div class="star">✨</div>

    <div class="star">✨</div>

    <div class="star">✨</div>

    <div class="star">✨</div>

    <div class="star">✨</div>

    <div class="heart-small">❤️</div>

    <div class="heart-small">❤️</div>

    <div class="heart-small">❤️</div>

    <div class="heart-small">❤️</div>

    <div class="heart-small">❤️</div>

    <div class="heart-small">❤️</div>

  </div>

  <div class="text-container">

    <div class="name-text">Mia Lê</div>

  </div>

  <script>

  /*

 * Settings

 */

var settings = {

  particles: {

    length:   500, // maximum amount of particles

    duration:   2, // particle duration in sec

    velocity: 100, // particle velocity in pixels/sec

    effect: -0.75, // play with this for a nice effect

    size:      30, // particle size in pixels

  },

};


/*

 * RequestAnimationFrame polyfill by Erik Möller

 */

(function(){var b=0;var c=["ms","moz","webkit","o"];for(var a=0;a<c.length&&!window.requestAnimationFrame;++a){window.requestAnimationFrame=window[c[a]+"RequestAnimationFrame"];window.cancelAnimationFrame=window[c[a]+"CancelAnimationFrame"]||window[c[a]+"CancelRequestAnimationFrame"]}if(!window.requestAnimationFrame){window.requestAnimationFrame=function(h,e){var d=new Date().getTime();var f=Math.max(0,16-(d-b));var g=window.setTimeout(function(){h(d+f)},f);b=d+f;return g}}if(!window.cancelAnimationFrame){window.cancelAnimationFrame=function(d){clearTimeout(d)}}}());


/*

 * Point class

 */

var Point = (function() {

  function Point(x, y) {

    this.x = (typeof x !== 'undefined') ? x : 0;

    this.y = (typeof y !== 'undefined') ? y : 0;

  }

  Point.prototype.clone = function() {

    return new Point(this.x, this.y);

  };

  Point.prototype.length = function(length) {

    if (typeof length == 'undefined')

      return Math.sqrt(this.x * this.x + this.y * this.y);

    this.normalize();

    this.x *= length;

    this.y *= length;

    return this;

  };

  Point.prototype.normalize = function() {

    var length = this.length();

    this.x /= length;

    this.y /= length;

    return this;

  };

  return Point;

})();


/*

 * Particle class

 */

var Particle = (function() {

  function Particle() {

    this.position = new Point();

    this.velocity = new Point();

    this.acceleration = new Point();

    this.age = 0;

  }

  Particle.prototype.initialize = function(x, y, dx, dy) {

    this.position.x = x;

    this.position.y = y;

    this.velocity.x = dx;

    this.velocity.y = dy;

    this.acceleration.x = dx * settings.particles.effect;

    this.acceleration.y = dy * settings.particles.effect;

    this.age = 0;

  };

  Particle.prototype.update = function(deltaTime) {

    this.position.x += this.velocity.x * deltaTime;

    this.position.y += this.velocity.y * deltaTime;

    this.velocity.x += this.acceleration.x * deltaTime;

    this.velocity.y += this.acceleration.y * deltaTime;

    this.age += deltaTime;

  };

  Particle.prototype.draw = function(context, image) {

    function ease(t) {

      return (--t) * t * t + 1;

    }

    var size = image.width * ease(this.age / settings.particles.duration);

    context.globalAlpha = 1 - this.age / settings.particles.duration;

    context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);

  };

  return Particle;

})();


/*

 * ParticlePool class

 */

var ParticlePool = (function() {

  var particles,

      firstActive = 0,

      firstFree   = 0,

      duration    = settings.particles.duration;



  function ParticlePool(length) {

    // create and populate particle pool

    particles = new Array(length);

    for (var i = 0; i < particles.length; i++)

      particles[i] = new Particle();

  }

  ParticlePool.prototype.add = function(x, y, dx, dy) {

    particles[firstFree].initialize(x, y, dx, dy);



    // handle circular queue

    firstFree++;

    if (firstFree   == particles.length) firstFree   = 0;

    if (firstActive == firstFree       ) firstActive++;

    if (firstActive == particles.length) firstActive = 0;

  };

  ParticlePool.prototype.update = function(deltaTime) {

    var i;



    // update active particles

    if (firstActive < firstFree) {

      for (i = firstActive; i < firstFree; i++)

        particles[i].update(deltaTime);

    }

    if (firstFree < firstActive) {

      for (i = firstActive; i < particles.length; i++)

        particles[i].update(deltaTime);

      for (i = 0; i < firstFree; i++)

        particles[i].update(deltaTime);

    }



    // remove inactive particles

    while (particles[firstActive].age >= duration && firstActive != firstFree) {

      firstActive++;

      if (firstActive == particles.length) firstActive = 0;

    }





  };

  ParticlePool.prototype.draw = function(context, image) {

    // draw active particles

    if (firstActive < firstFree) {

      for (i = firstActive; i < firstFree; i++)

        particles[i].draw(context, image);

    }

    if (firstFree < firstActive) {

      for (i = firstActive; i < particles.length; i++)

        particles[i].draw(context, image);

      for (i = 0; i < firstFree; i++)

        particles[i].draw(context, image);

    }

  };

  return ParticlePool;

})();


/*

 * Putting it all together

 */

(function(canvas) {

  var context = canvas.getContext('2d'),

      particles = new ParticlePool(settings.particles.length),

      particleRate = settings.particles.length / settings.particles.duration, // particles/sec

      time;



  // get point on heart with -PI <= t <= PI

  function pointOnHeart(t) {

    return new Point(

      160 * Math.pow(Math.sin(t), 3),

      130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25

    );

  }



  // creating the particle image using a dummy canvas

  var image = (function() {

    var canvas  = document.createElement('canvas'),

        context = canvas.getContext('2d');

    canvas.width  = settings.particles.size;

    canvas.height = settings.particles.size;

    // helper function to create the path

    function to(t) {

      var point = pointOnHeart(t);

      point.x = settings.particles.size / 2 + point.x * settings.particles.size / 350;

      point.y = settings.particles.size / 2 - point.y * settings.particles.size / 350;

      return point;

    }

    // create the path

    context.beginPath();

    var t = -Math.PI;

    var point = to(t);

    context.moveTo(point.x, point.y);

    while (t < Math.PI) {

      t += 0.01; // baby steps!

      point = to(t);

      context.lineTo(point.x, point.y);

    }

    context.closePath();

    // create the fill

    context.fillStyle = '#ea80b0';

    context.fill();

    // create the image

    var image = new Image();

    image.src = canvas.toDataURL();

    return image;

  })();



  // render that thing!

  function render() {

    // next animation frame

    requestAnimationFrame(render);



    // update time

    var newTime   = new Date().getTime() / 1000,

        deltaTime = newTime - (time || newTime);

    time = newTime;



    // clear canvas

    context.clearRect(0, 0, canvas.width, canvas.height);



    // create new particles

    var amount = particleRate * deltaTime;

    for (var i = 0; i < amount; i++) {

      var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());

      var dir = pos.clone().length(settings.particles.velocity);

      particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);

    }



    // update and draw particles

    particles.update(deltaTime);

    particles.draw(context, image);

  }



  // handle (re-)sizing of the canvas

  function onResize() {

    canvas.width  = canvas.clientWidth;

    canvas.height = canvas.clientHeight;

  }

  window.onresize = onResize;



  // delay rendering bootstrap

  setTimeout(function() {

    onResize();

    render();

  }, 10);

})(document.getElementById('pinkboard'));

  </script>

 </body>
